name: SAT Tables Update

on:
  push:
    paths:
      - 'src/utils/taxTables/**/*.json'

permissions:
  contents: read

jobs:
  fiscal-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test:utils
