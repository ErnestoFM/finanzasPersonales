<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <!-- Gradiente horizontal cyan → indigo, alineado al ancho del ícono -->
    <linearGradient id="flow-grad" x1="0" y1="0" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>

  <!-- Fondo redondeado: slate-950 -->
  <rect width="32" height="32" rx="7" fill="#0f172a"/>

  <!-- Onda superior — sutil, 50% opacidad -->
  <path
    d="M4 11 Q10 6 16 11 Q22 16 28 11"
    stroke="url(#flow-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.5"
  />

  <!-- Onda central — principal, opaca -->
  <path
    d="M4 16 Q10 11 16 16 Q22 21 28 16"
    stroke="url(#flow-grad)"
    stroke-width="3.5"
    stroke-linecap="round"
  />

  <!-- Onda inferior — sutil, 50% opacidad -->
  <path
    d="M4 21 Q10 16 16 21 Q22 26 28 21"
    stroke="url(#flow-grad)"
    stroke-width="2.5"
    stroke-linecap="round"
    opacity="0.5"
  />
</svg>
